services:
  - type: web
    name: acadet-jamb-cbt
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run db:migrate && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: acadet-jamb-cbt-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

databases:
  - name: acadet-jamb-cbt-db
    plan: starter
    databaseName: acadet_jamb_cbt
    user: acadet_jamb_user
